<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121018">
<meta name="color-scheme" content="dark">
<title>أورا TV</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<script>
/* If something ever breaks at startup, show the reason on screen instead of a blank page. Tap to dismiss. */
(function () {
  function show(msg) {
    try {
      var d = document.getElementById('crash');
      if (!d) {
        d = document.createElement('pre'); d.id = 'crash';
        d.style.cssText = 'position:fixed;z-index:99999;left:8px;right:8px;top:8px;margin:0;background:#3a0d12;color:#ffe3e6;border:1px solid #e0707a;padding:10px;border-radius:10px;font:12px/1.5 monospace;white-space:pre-wrap;word-break:break-all;direction:ltr;text-align:left;max-height:55vh;overflow:auto';
        d.onclick = function () { d.remove(); };
        document.body.appendChild(d);
      }
      d.textContent += msg + '\n';
    } catch (e) { /* ignore */ }
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && t.tagName) {
      // only a failed app script/stylesheet is fatal; images, <video> streams and optional vendor libs are not
      var u = t.src || t.href || '';
      if ((t.tagName === 'SCRIPT' || t.tagName === 'LINK') && !/\/vendor\//.test(u)) show('Load error: ' + u);
    }
    else if (e.message) show('JS error: ' + e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?') + ')');
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason; show('Promise error: ' + ((r && r.message) || r));
  });
})();
</script>
<div id="app">
  <header class="topbar">
    <div class="brand" aria-label="Aura TV">
      <svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a78d6"/><stop offset="1" stop-color="#e2bb4e"/></linearGradient></defs>
        <circle cx="24" cy="24" r="20" fill="none" stroke="url(#lg)" stroke-width="4"/>
        <path d="M19 15.5v17l14-8.5z" fill="#e2bb4e"/>
      </svg>
      <span class="brand-name" data-i18n="app"></span>
    </div>
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search" data-i18n-ph="search" data-i18n-aria="search">
      <button id="qClear" class="icon-btn small" hidden data-i18n-aria="clear"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <button id="btnSource" class="chip source-btn" data-i18n-aria="sources"><span id="srcName"></span></button>
    <button id="btnSettings" class="icon-btn" data-i18n-aria="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>

  <nav id="tabs" class="tabs" role="tablist"></nav>

  <section class="filters" aria-label="filters">
    <div id="cats" class="chips scroll" role="listbox" data-i18n-aria="categories"></div>
    <div class="row2">
      <div id="qual" class="chips" role="group" data-i18n-aria="quality"></div>
      <label class="sort"><span data-i18n="sort"></span>
        <select id="sort"><option value="default" data-i18n="sortDefault"></option><option value="az" data-i18n="sortAz"></option></select>
      </label>
    </div>
  </section>

  <main id="content">
    <div id="meta" class="meta" aria-live="polite"></div>
    <div id="grid" class="grid"></div>
    <div id="sentinel" style="height:1px"></div>
    <div id="empty" class="empty" hidden></div>
  </main>
</div>

<div id="player" class="player" hidden>
  <video id="video" playsinline webkit-playsinline preload="auto"></video>
  <div id="stage" class="stage" tabindex="0" data-i18n-aria="player"></div>
  <div id="pStatus" class="p-status" hidden><div class="spinner"></div><div id="pStatusText"></div><div id="pActions" class="p-actions"></div></div>
  <div id="pTop" class="p-top">
    <button id="pBack" class="icon-btn" data-i18n-aria="back"><svg class="ico flip" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="p-title"><div id="pTitle"></div><div id="pSub" class="sub"></div></div>
    <span id="pLive" class="live-pill" hidden>LIVE</span>
  </div>
  <div id="pBar" class="p-bar">
    <div id="seekRow" class="seek-row" hidden><span id="tCur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" step="1" data-i18n-aria="seek"><span id="tDur">0:00</span></div>
    <div class="controls">
      <button id="cPrev" class="icon-btn" data-i18n-aria="prev"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
      <button id="cPlay" class="icon-btn big" data-i18n-aria="playpause"></button>
      <button id="cNext" class="icon-btn" data-i18n-aria="next"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <span class="spacer"></span>
      <button id="cFav" class="icon-btn" data-i18n-aria="favorite"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
      <button id="cAspect" class="icon-btn" data-i18n-aria="aspect"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10v4M17 10v4"/></svg></button>
      <button id="cPip" class="icon-btn" hidden data-i18n-aria="pip"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor"/></svg></button>
    </div>
  </div>
</div>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="sheet-head"><h2 id="mTitle"></h2><button id="mClose" class="icon-btn" data-i18n-aria="close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="mBody" class="sheet-body"></div>
  </div>
</div>

<div id="loader" class="loader" hidden role="status"><div class="spinner"></div><div id="loaderText"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
