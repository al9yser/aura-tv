name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # needed only to attach the APK to a release on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests (parser, Xtream, engine planner)
        run: npm test

      - name: Bundle playback libraries (hls.js, mpegts.js)
        run: node scripts/prepare-web.mjs

      - name: Generate Android project
        run: npx cap add android

      - name: Patch manifest for TV + branding
        run: python3 scripts/patch_android.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          PROPS=gradle/wrapper/gradle-wrapper.properties
          # the default 10s download timeout is too short when the Gradle host is slow
          sed -i 's/^networkTimeout=.*/networkTimeout=180000/' $PROPS
          VER=$(grep -oE 'gradle-[0-9.]+-(all|bin)\.zip' $PROPS | head -1 | sed -E 's/gradle-([0-9.]+)-.*/\1/')
          echo "Gradle wrapper version: $VER"
          # attempt 1: smaller -bin distribution from the official host
          # attempt 2: mirror (used when the official/GitHub release host is down)
          # attempt 3: official again
          for attempt in 1 2 3; do
            case $attempt in
              2) sed -i "s#^distributionUrl=.*#distributionUrl=https://mirrors.cloud.tencent.com/gradle/gradle-${VER}-bin.zip#" $PROPS ;;
              *) sed -i "s#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-${VER}-bin.zip#" $PROPS ;;
            esac
            grep distributionUrl $PROPS
            ./gradlew assembleDebug --no-daemon --stacktrace && exit 0
            echo "Gradle attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk aura-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aura-tv-apk
          path: aura-tv.apk
          if-no-files-found: error

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aura-tv.apk
